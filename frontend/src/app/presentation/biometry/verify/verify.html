<div class="page-container">
  <h1>Verificação facial (1:1)</h1>

  <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline">
      <mat-label>CPF</mat-label>
      <input matInput formControlName="cpf" />
      <mat-error *ngIf="verifyForm.get('cpf')?.hasError('required')">
        Obrigatório
      </mat-error>
      <mat-error *ngIf="verifyForm.get('cpf')?.hasError('onlyNumbers')">
        O CPF deve conter 11 números
      </mat-error>
    </mat-form-field>

    <div class="threshold-field">
      <label>Threshold: {{ verifyForm.value.threshold | number:'1.2-2' }}</label>
      <mat-slider min="0" max="1" step="0.01" discrete>
        <input matSliderThumb formControlName="threshold" />
      </mat-slider>
    </div>

    <div class="file-upload">
      <button mat-stroked-button type="button" (click)="fileInput.click()">
        Aenxar foto
      </button>
      <input #fileInput type="file" accept="image/*" (change)="onPictureSelected($event)" hidden />
      <span *ngIf="selectedFile">{{ selectedFile.name }}</span>
    </div>

    <p *ngIf="error()">{{ error() }}</p>

    <button mat-raised-button color="primary" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Verificando...' : 'Verificar' }}
    </button>

  </form>

  <div *ngIf="result()" class="result-card" [class.success]="result()!.matches" [class.fail]="!result()!.matches">
    <h2 *ngIf="result()!.matches">Compatível</h2>
    <h2 *ngIf="!result()!.matches">Não compatível</h2>
    <p><strong>Score:</strong> {{ result()!.similarityScore | number:'1.2-2' }}</p>
  </div>

  <button mat-button (click)="goBack()">← Voltar</button>
</div>
