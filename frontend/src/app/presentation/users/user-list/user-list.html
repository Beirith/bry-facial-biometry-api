<h1>Usuários cadastrados</h1>

<p *ngIf="loading()">Carregando...</p>
<p *ngIf="error()">{{ error() }}</p>

<table *ngIf="!loading() && !error()">
  <thead>
  <tr>
    <th>ID</th>
    <th>Nome</th>
    <th>CPF</th>
    <th>Ações</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let user of users()">
    <td>{{ user.id }}</td>
    <td>{{ user.name }}</td>
    <td>{{ user.cpf }}</td>
      <button (click)="editUser(user.id)">Editar</button>
  </tr>
  </tbody>
</table>
