<div class="page-container">
  <div class="header">
    <h1>Usuários cadastrados</h1>
  </div>

  <p *ngIf="loading()">Carregando...</p>
  <p *ngIf="error()">{{ error() }}</p>

  <div class="batch-actions">
    <button mat-raised-button color="primary" (click)="createUser()">+</button>
    <div class="selection-actions">
      <button mat-raised-button color="primary" [disabled]="!hasSelection" (click)="updateSelected()">
        Atualizar ({{ selectedIds().size }})
      </button>
      <button mat-raised-button color="primary" [disabled]="!hasSelection" (click)="deleteSelected()">
        Excluir ({{ selectedIds().size }})
      </button>
    </div>
  </div>

  <table *ngIf="!loading() && !error() && users().length > 0">
    <thead>
    <tr>
      <th></th>
      <th>ID</th>
      <th>Nome</th>
      <th>CPF</th>
      <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users()">
      <td>
        <mat-checkbox [checked]="isSelected(user.id)" (change)="toggleSelection(user.id)"></mat-checkbox>
      </td>
      <td>{{ user.id }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.cpf }}</td>
      <td>
        <button mat-stroked-button color="primary" (click)="viewUser(user.id)">Detalhes</button>
        <button mat-stroked-button color="primary" (click)="editUser(user.id)">Editar</button>
        <button mat-stroked-button color="primary" (click)="verifyUser(user.cpf)">Verificar</button>
      </td>
    </tr>
    </tbody>
  </table>

  <p *ngIf="!loading() && !error() && users().length === 0" class="empty-message">
    Nenhum usuário cadastrado.
    Cadastre usuários por meio do botão '+' ou pela aba 'Cadastrar'.
  </p>
</div>
