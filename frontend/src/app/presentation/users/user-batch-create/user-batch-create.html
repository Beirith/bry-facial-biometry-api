<div class="page-container">
  <h1>Cadastro em lote</h1>

  <form [formGroup]="batchForm" (ngSubmit)="onSubmit()">

    <div formArrayName="users">
      <div *ngFor="let group of userGroups; let i = index" [formGroupName]="i" class="user-block">
        <h3>Usuário {{ i + 1 }}</h3>

        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="name" />
          <mat-error *ngIf="group.get('name')?.hasError('required')">
            Obrigatório
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>CPF</mat-label>
          <input matInput formControlName="cpf" />
          <mat-error *ngIf="group.get('cpf')?.hasError('required')">
            Obrigatório
          </mat-error>
          <mat-error *ngIf="group.get('cpf')?.hasError('onlyNumbers')">
            O CPF deve conter 11 números
          </mat-error>
        </mat-form-field>

        <div class="file-upload">
          <button mat-stroked-button type="button" (click)="fileInput.click()">
            Aenxar foto
          </button>
          <input #fileInput type="file" accept="image/*" (change)="onFileSelected(i, $event)" hidden />
          <span *ngIf="selectedFiles[i]">{{ selectedFiles[i]?.name }}</span>
        </div>

        <button mat-stroked-button color="warn" type="button" (click)="removeUser(i)" *ngIf="userGroups.length > 1">
          Remover
        </button>
      </div>
    </div>

    <button mat-stroked-button type="button" (click)="addUser()">+ Adicionar usuário</button>

    <p *ngIf="error()">{{ error() }}</p>

    <button mat-raised-button color="primary" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Cadastrando...' : 'Cadastrar todos' }}
    </button>

  </form>

  <div *ngIf="results()">
    <h2>Resultado</h2>
    <ul>
      <li *ngFor="let result of results()">
        <span *ngIf="result.success"> {{ result.name }} ({{ result.cpf }}) — cadastrado com sucesso</span>
        <span *ngIf="!result.success"> {{ result.name || 'Usuário' }} — erro: {{ result.error }}</span>
      </li>
    </ul>
  </div>

  <button mat-button (click)="goHome()">← Voltar</button>
</div>
