<h1>Cadastro em lote</h1>

<form [formGroup]="batchForm" (ngSubmit)="onSubmit()">

  <div formArrayName="users">
    <div *ngFor="let group of userGroups; let i = index" [formGroupName]="i">
      <h3>Usuário {{ i + 1 }}</h3>

      <div>
        <label>Nome</label>
        <input type="text" formControlName="name" />
      </div>

      <div>
        <label>CPF</label>
        <input type="text" formControlName="cpf" />
      </div>

      <div>
        <label>Foto</label>
        <input type="file" accept="image/*" (change)="onFileSelected(i, $event)" />
      </div>

      <button type="button" (click)="removeUser(i)" *ngIf="userGroups.length > 1">
        Remover
      </button>
    </div>
  </div>

  <button type="button" (click)="addUser()">+ Adicionar usuário</button>

  <p *ngIf="error()">{{ error() }}</p>

  <button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Cadastrando...' : 'Cadastrar todos' }}
  </button>

</form>

<div *ngIf="results()">
  <h2>Resultado</h2>
  <ul>
    <li *ngFor="let result of results()">
      <span *ngIf="result.success">[OK] {{ result.name }} ({{ result.cpf }}) — cadastrado com sucesso</span>
      <span *ngIf="!result.success">[ERRO] {{ result.name || 'Usuário' }} — erro: {{ result.error }}</span>
    </li>
  </ul>
</div>
