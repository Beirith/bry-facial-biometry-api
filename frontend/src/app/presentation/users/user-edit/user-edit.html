<div class="page-container">
  <h1>Editar usuário</h1>

  <p *ngIf="loading()">Carregando...</p>

  <form *ngIf="!loading()" [formGroup]="updateForm" (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="updateForm.get('name')?.hasError('required')">
        Obrigatório
      </mat-error>
    </mat-form-field>

    <div class="file-upload">
      <button mat-stroked-button type="button" (click)="fileInput.click()">
        Anexar nova foto (opcional)
      </button>
      <input #fileInput type="file" accept="image/*" (change)="onPictureSelected($event)" hidden />
      <span *ngIf="selectedFile">{{ selectedFile.name }}</span>
    </div>

    <p *ngIf="error()">{{ error() }}</p>

    <button mat-raised-button color="primary" type="submit"
            [disabled]="submitting() || (updateForm.pristine && !selectedFile)">
      {{ submitting() ? 'Salvando...' : 'Salvar' }}
    </button>

  </form>

  <button mat-button (click)="goHome()">← Voltar</button>
</div>
